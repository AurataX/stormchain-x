services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: stormchain
      POSTGRES_DB: stormchain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stormchain-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stormchain -d stormchain"]
      interval: 5s
      timeout: 5s
      retries: 12
  init:
    build: ./apps/api
    environment: &api-environment
      DATABASE_URL: postgresql+asyncpg://stormchain:${POSTGRES_PASSWORD:?Set password}@db:5432/stormchain
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?Set OPERATOR_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.bootstrap"]
  api:
    build: ./apps/api
    environment: *api-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  stormchain-data:
